name: scripts-parity

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:       # "Run workflow" button for manual checks

env:
  BRANCH_A: master-sea
  BRANCH_B: master-aws-au-al9

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # fetch all branches, otherwise there is nothing to compare

      - name: Check both branches exist
        run: |
          for b in "$BRANCH_A" "$BRANCH_B"; do
            if ! git rev-parse --verify --quiet "origin/$b" > /dev/null; then
              echo "::error::Branch '$b' not found. Was it renamed (WAF-53)? Update env in scripts-parity.yml."
              exit 1
            fi
          done

      - name: Compare scripts/
        run: |
          diff=$(git diff --name-only "origin/$BRANCH_A" "origin/$BRANCH_B" -- scripts/)
          if [ -n "$diff" ]; then
            echo "::error::scripts/ differs between $BRANCH_A and $BRANCH_B"
            echo "Differing files:"
            echo "$diff"
            exit 1
          fi
          echo "scripts/ is identical on $BRANCH_A and $BRANCH_B"
